<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sentinel</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header>
      <div class="logo">
        <img src="../icons/icon48.png" alt="" width="24" height="24"/>
        <span>Sentinel</span>
      </div>
      <span class="tagline">Email Forensics</span>
    </header>

    <!-- Signed-out state -->
    <section id="signed-out" class="hidden">
      <p class="desc">Connect your Gmail account to enable real-time threat detection.</p>
      <button id="btn-signin" class="btn btn-primary">
        <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
    </section>

    <!-- Signed-in state -->
    <section id="signed-in" class="hidden">
      <div class="user-row">
        <div class="avatar" id="user-avatar">A</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Analyst</div>
          <div class="user-email" id="user-email"></div>
        </div>
        <div class="status-dot" title="Monitoring active"></div>
      </div>

      <div class="stat-grid">
        <div class="stat-card" id="stat-alerts">
          <div class="stat-value" id="alert-count">—</div>
          <div class="stat-label">Active Alerts</div>
        </div>
        <div class="stat-card" id="stat-cases">
          <div class="stat-value" id="case-count">—</div>
          <div class="stat-label">Cases</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="scan-status">Live</div>
          <div class="stat-label">Status</div>
        </div>
      </div>

      <div class="action-row">
        <a id="btn-open-app" class="btn btn-secondary" target="_blank">
          Open Dashboard ↗
        </a>
        <button id="btn-scan-now" class="btn btn-primary">Scan Now</button>
      </div>

      <button id="btn-signout" class="btn btn-ghost">Sign out</button>
    </section>

    <!-- Loading -->
    <section id="loading">
      <div class="spinner"></div>
    </section>

  </div>
  <script src="popup.js"></script>
</body>
</html>
